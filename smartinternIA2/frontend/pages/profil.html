<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    (function(){
      const t = localStorage.getItem('si_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon Profil — SmartIntern AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563eb; --blue-dark: #1d4ed8; --blue-glow: rgba(37,99,235,0.15);
      --dark: #04070f; --dark2: #0c1220; --surface: #141c2e; --surface2: #1a2540;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
      --text: #f1f5f9; --text2: #94a3b8; --text3: #475569;
      --green: #10b981; --red: #ef4444; --purple: #8b5cf6; --pink: #ec4899;
      --amber: #f59e0b;
    }
    [data-theme="light"] {
      --dark: #f8fafc; --dark2: #ffffff; --surface: #f1f5f9; --surface2: #e2e8f0;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
      --text: #0f172a; --text2: #475569; --text3: #94a3b8;
    }
    html, body { min-height: 100vh; font-family: 'Sora', system-ui, sans-serif; background: var(--dark); color: var(--text); }
    .topbar {
      height: 64px; background: var(--dark2); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; position: sticky; top: 0; z-index: 50;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .back-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
      color: var(--text2); font-size: 0.85rem; cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }
    .back-btn:hover { background: var(--surface2); color: var(--text); }
    .topbar-title { font-size: 1rem; font-weight: 700; }
    .theme-btn {
      width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border2);
      border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--text2);
    }
    .page { max-width: 780px; margin: 2.5rem auto; padding: 0 1.5rem 4rem; }

    /* ── Avatar section ── */
    .avatar-section {
      display: flex; align-items: center; gap: 2rem; padding: 2rem;
      background: var(--surface); border: 1px solid var(--border2); border-radius: 16px;
      margin-bottom: 1.5rem;
    }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar-img {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      display: grid; place-items: center; font-size: 2rem; font-weight: 700;
      color: #fff; overflow: hidden; border: 3px solid var(--border2);
    }
    .avatar-img img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-change-btn {
      position: absolute; bottom: 0; right: 0;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--blue); border: 2px solid var(--dark2);
      display: grid; place-items: center; cursor: pointer;
      color: #fff; transition: background 0.15s;
    }
    .avatar-change-btn:hover { background: var(--blue-dark); }
    .avatar-change-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; }
    .avatar-info h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .avatar-info p { color: var(--text2); font-size: 0.875rem; }
    .avatar-role {
      display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 99px;
      font-size: 0.72rem; font-weight: 600;
      background: var(--blue-glow); color: #60a5fa;
    }
    #photo-input { display: none; }
    .photo-hint { font-size: 0.72rem; color: var(--text3); margin-top: 6px; }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border2); border-radius: 16px;
      padding: 1.75rem; margin-bottom: 1.5rem;
    }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; }
    .card-title svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; color: var(--blue); }

    /* ── Form ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .form-grid.full { grid-template-columns: 1fr; }
    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.78rem; font-weight: 600; color: var(--text2); }
    .form-group input, .form-group select {
      background: var(--surface2); border: 1px solid var(--border2); border-radius: 9px;
      padding: 10px 14px; color: var(--text); font-family: inherit; font-size: 0.875rem;
      transition: border-color 0.15s; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--blue); }
    .form-group input[readonly] { opacity: 0.5; cursor: not-allowed; }
    .form-group input[readonly]:focus { border-color: var(--border2); }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn-primary {
      padding: 10px 24px; background: var(--blue); border: none; border-radius: 9px;
      color: #fff; font-family: inherit; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      padding: 10px 20px; background: var(--surface2); border: 1px solid var(--border2);
      border-radius: 9px; color: var(--text2); font-family: inherit; font-size: 0.875rem;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-secondary:hover { background: var(--dark2); color: var(--text); }

    /* ── Alert ── */
    .alert {
      padding: 10px 16px; border-radius: 9px; font-size: 0.85rem; margin-bottom: 1rem;
      display: none;
    }
    .alert.success { background: rgba(16,185,129,0.12); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
    .alert.error   { background: rgba(239,68,68,0.12);  color: var(--red);   border: 1px solid rgba(239,68,68,0.25); }

    /* ── Password strength ── */
    .pwd-strength { height: 4px; border-radius: 2px; margin-top: 6px; background: var(--border2); }
    .pwd-strength-bar { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
    .pwd-hint { font-size: 0.72rem; color: var(--text3); margin-top: 4px; }

    /* ── Section divider ── */
    .section-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--text3); margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-btn" id="back-btn" href="#">
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Retour
    </a>
    <span class="topbar-title">Mon Profil</span>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="Changer le thème">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>
</div>

<div class="page">
  <div id="alert-global" class="alert"></div>

  <!-- Avatar -->
  <div class="avatar-section">
    <div class="avatar-wrap">
      <div class="avatar-img" id="avatar-display"><span id="avatar-initials">…</span></div>
      <label class="avatar-change-btn" for="photo-input" title="Changer la photo">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </label>
      <input type="file" id="photo-input" accept="image/*" onchange="handlePhotoChange(this)"/>
    </div>
    <div class="avatar-info">
      <h2 id="profile-fullname">Chargement…</h2>
      <p id="profile-email">—</p>
      <span class="avatar-role" id="profile-role">—</span>
      <p class="photo-hint">JPG, PNG ou GIF · max 2 Mo</p>
    </div>
  </div>

  <!-- Informations personnelles -->
  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Informations personnelles
    </div>
    <div id="alert-profile" class="alert"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="inp-prenom" placeholder="Votre prénom"/>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="inp-nom" placeholder="Votre nom"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="inp-email" readonly/>
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" id="inp-telephone" placeholder="+216 XX XXX XXX"/>
      </div>
    </div>
    <!-- Champs spécifiques étudiants -->
    <div id="section-etudiant" style="display:none; margin-top: 1.2rem;">
      <div class="section-label">Informations académiques</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Filière</label>
          <input type="text" id="inp-filiere" placeholder="Ex : Génie Logiciel"/>
        </div>
        <div class="form-group">
          <label>Classe</label>
          <input type="text" id="inp-classe" placeholder="Ex : 3ème année"/>
        </div>
        <div class="form-group">
          <label>Code étudiant</label>
          <input type="text" id="inp-code-etudiant" readonly/>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-save-profile" onclick="saveProfile()">Enregistrer</button>
      <button class="btn-secondary" onclick="resetProfileForm()">Annuler</button>
    </div>
  </div>

  <!-- Changement de mot de passe -->
  <div class="card">
    <div class="card-title">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Changer le mot de passe
    </div>
    <div id="alert-password" class="alert"></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Mot de passe actuel</label>
        <input type="password" id="inp-old-pwd" placeholder="••••••••"/>
      </div>
      <div class="form-group" style="grid-column: 1 / -1; max-width: 360px;">
        <label>Nouveau mot de passe</label>
        <input type="password" id="inp-new-pwd" placeholder="Min. 8 caractères" oninput="checkPasswordStrength(this.value)"/>
        <div class="pwd-strength"><div class="pwd-strength-bar" id="pwd-bar"></div></div>
        <span class="pwd-hint" id="pwd-hint">Entrez un mot de passe</span>
      </div>
      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="inp-confirm-pwd" placeholder="••••••••"/>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-save-pwd" onclick="savePassword()">Modifier le mot de passe</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
// ── Navigation retour selon le rôle ───────────────────────────────────────────
const ROLE_DASHBOARDS = {
  'ADMIN': '../pages/admin-dashboard.html',
  'ETUDIANT': '../pages/etudiant-dashboard.html',
  'ENTREPRISE': '../pages/entreprise-dashboard.html',
  'ENCADRANT_ACADEMIQUE': '../pages/encadrant-academique-dashboard.html',
  'ENCADRANT_ENTREPRISE': '../pages/encadrant-entreprise-dashboard.html'
};

let currentUser = null;
let originalData = {};

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const token = sessionStorage.getItem('smartintern_token');
  if (!token) { window.location.href = '../pages/login.html'; return; }
  await loadProfile();
});

async function loadProfile() {
  try {
    currentUser = await apiGetMe();
    originalData = { ...currentUser };

    // Back button
    const dash = ROLE_DASHBOARDS[currentUser.role] || '../pages/login.html';
    document.getElementById('back-btn').href = dash;

    // Avatar
    updateAvatar(currentUser);

    // Header info
    document.getElementById('profile-fullname').textContent = `${currentUser.firstName || ''} ${currentUser.lastName || ''}`.trim() || 'Utilisateur';
    document.getElementById('profile-email').textContent = currentUser.email || '—';
    document.getElementById('profile-role').textContent = getRoleName(currentUser.role);

    // Form
    document.getElementById('inp-prenom').value    = currentUser.firstName  || '';
    document.getElementById('inp-nom').value        = currentUser.lastName   || '';
    document.getElementById('inp-email').value      = currentUser.email      || '';
    document.getElementById('inp-telephone').value  = currentUser.telephone  || '';

    // Champs étudiants
    if (currentUser.role === 'ETUDIANT') {
      document.getElementById('section-etudiant').style.display = 'block';
      document.getElementById('inp-filiere').value      = currentUser.filiere       || '';
      document.getElementById('inp-classe').value        = currentUser.classe        || '';
      document.getElementById('inp-code-etudiant').value = currentUser.codeEtudiant  || '';
    }
  } catch (e) {
    showAlert('alert-global', 'error', 'Erreur de chargement du profil. Veuillez vous reconnecter.');
  }
}

function updateAvatar(user) {
  const el = document.getElementById('avatar-display');
  if (user.photoProfil) {
    el.innerHTML = `<img src="${user.photoProfil}" alt="photo"/>`;
  } else {
    const initials = ((user.firstName || '')[0] || '') + ((user.lastName || '')[0] || '');
    el.innerHTML = `<span id="avatar-initials">${initials || '?'}</span>`;
  }
}

// ── Photo ─────────────────────────────────────────────────────────────────────
async function handlePhotoChange(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    showAlert('alert-global', 'error', 'Image trop volumineuse (max 2 Mo).');
    return;
  }
  try {
    const dataUrl = await apiUploadPhoto(file);
    currentUser.photoProfil = dataUrl;
    updateAvatar(currentUser);
    showAlert('alert-global', 'success', 'Photo de profil mise à jour !');
  } catch (e) {
    showAlert('alert-global', 'error', 'Erreur lors du téléversement de la photo.');
  }
}

// ── Sauvegarde profil ─────────────────────────────────────────────────────────
async function saveProfile() {
  const btn = document.getElementById('btn-save-profile');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    const data = {
      firstName: document.getElementById('inp-prenom').value.trim(),
      lastName:  document.getElementById('inp-nom').value.trim(),
      telephone: document.getElementById('inp-telephone').value.trim()
    };
    if (!data.firstName || !data.lastName) {
      showAlert('alert-profile', 'error', 'Le prénom et le nom sont obligatoires.');
      return;
    }
    if (currentUser.role === 'ETUDIANT') {
      data.filiere = document.getElementById('inp-filiere').value.trim();
      data.classe  = document.getElementById('inp-classe').value.trim();
    }
    await apiUpdateProfile(data);
    // Mettre à jour l'affichage
    document.getElementById('profile-fullname').textContent = `${data.firstName} ${data.lastName}`;
    showAlert('alert-profile', 'success', 'Profil mis à jour avec succès !');
  } catch (e) {
    showAlert('alert-profile', 'error', e.message || 'Erreur lors de la mise à jour.');
  } finally {
    btn.disabled = false; btn.textContent = 'Enregistrer';
  }
}

function resetProfileForm() {
  document.getElementById('inp-prenom').value   = currentUser.firstName  || '';
  document.getElementById('inp-nom').value       = currentUser.lastName   || '';
  document.getElementById('inp-telephone').value = currentUser.telephone  || '';
  if (currentUser.role === 'ETUDIANT') {
    document.getElementById('inp-filiere').value = currentUser.filiere || '';
    document.getElementById('inp-classe').value  = currentUser.classe  || '';
  }
  hideAlert('alert-profile');
}

// ── Changement mot de passe ────────────────────────────────────────────────────
async function savePassword() {
  const oldPwd     = document.getElementById('inp-old-pwd').value;
  const newPwd     = document.getElementById('inp-new-pwd').value;
  const confirmPwd = document.getElementById('inp-confirm-pwd').value;

  if (!oldPwd || !newPwd || !confirmPwd) {
    showAlert('alert-password', 'error', 'Tous les champs sont obligatoires.');
    return;
  }
  if (newPwd.length < 8) {
    showAlert('alert-password', 'error', 'Le mot de passe doit contenir au moins 8 caractères.');
    return;
  }
  if (newPwd !== confirmPwd) {
    showAlert('alert-password', 'error', 'Les mots de passe ne correspondent pas.');
    return;
  }
  const btn = document.getElementById('btn-save-pwd');
  btn.disabled = true; btn.textContent = 'Modification…';
  try {
    await apiChangePassword(oldPwd, newPwd);
    document.getElementById('inp-old-pwd').value     = '';
    document.getElementById('inp-new-pwd').value     = '';
    document.getElementById('inp-confirm-pwd').value = '';
    showAlert('alert-password', 'success', 'Mot de passe modifié avec succès !');
  } catch (e) {
    showAlert('alert-password', 'error', e.message || 'Erreur lors du changement de mot de passe.');
  } finally {
    btn.disabled = false; btn.textContent = 'Modifier le mot de passe';
  }
}

// ── Password strength ─────────────────────────────────────────────────────────
function checkPasswordStrength(value) {
  const bar = document.getElementById('pwd-bar');
  const hint = document.getElementById('pwd-hint');
  let score = 0;
  if (value.length >= 8) score++;
  if (/[A-Z]/.test(value)) score++;
  if (/[0-9]/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;
  const levels = [
    { w: '0%',   bg: 'transparent', txt: 'Entrez un mot de passe' },
    { w: '25%',  bg: '#ef4444',     txt: 'Très faible' },
    { w: '50%',  bg: '#f59e0b',     txt: 'Faible' },
    { w: '75%',  bg: '#3b82f6',     txt: 'Correct' },
    { w: '100%', bg: '#10b981',     txt: 'Fort' }
  ];
  const l = levels[value.length === 0 ? 0 : score] || levels[0];
  bar.style.width = l.w; bar.style.background = l.bg; hint.textContent = l.txt;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `alert ${type}`;
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}
function hideAlert(id) { document.getElementById(id).style.display = 'none'; }

function getRoleName(role) {
  const r = { ETUDIANT: 'Étudiant', ENTREPRISE: 'Entreprise', ADMIN: 'Administrateur',
               ENCADRANT_ACADEMIQUE: 'Encadrant Académique', ENCADRANT_ENTREPRISE: 'Encadrant Entreprise' };
  return r[role] || role || '—';
}

function toggleTheme() {
  const html = document.documentElement;
  const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', t);
  localStorage.setItem('si_theme', t);
}
</script>
</body>
</html>
